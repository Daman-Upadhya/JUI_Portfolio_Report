<style>
/* VisiLean design tokens. Light is the default; dark is opt-in via <html data-theme="dark">.
   Rule: chrome is neutral, marks carry colour. No raw hex anywhere outside this file. */
:root {
  --bg: #f5f6f8;
  --card: #ffffff;
  --ink: #2b3237;
  --muted: #626e76;
  --faint: #7e8c96;
  --line: #e0e5e9;
  --inset: #f4f6f9;
  --brand: #1793e6;

  /* semantic pairs: a foreground and its tint, always used together */
  --good: #008344;   --good-bg: #e4fbf3;
  --warn: #c27d00;   --warn-bg: #fef5e5;
  --inert: #626e76;  --inert-bg: #eef1f4;
  --bad: #d13636;    --bad-bg: #ffecec;

  /* categorical series, in validated order: approved, draft, reopened, in-review, rejected */
  --s-app: #008300;
  --s-draft: #6b7a86;
  --s-reop: #eda100;
  --s-prog: #2a78d6;
  --s-rej: #e34948;
  --s-idle: #c9d2d9;

  /* categorical slots for reason categories: a validated order (adjacent pairs stay apart
     under colour-vision deficiency); assigned in fixed order, never cycled past 8 */
  --cat-1: #2a78d6;
  --cat-2: #eb6834;
  --cat-3: #1baf7a;
  --cat-4: #eda100;
  --cat-5: #e87ba4;
  --cat-6: #008300;
  --cat-7: #4a3aa7;
  --cat-8: #e34948;

  /* ordinal ageing ramp: 1-7 / 8-14 / 15-30 / 31-60 / 60+ days */
  --age-1: #86b6ef;
  --age-2: #6da7ec;
  --age-3: #3987e5;
  --age-4: #256abf;
  --age-5: #184f95;

  --line-soft: #ebeef0;   /* hairline, card border, row divider */
  --surface: #ffffff;     /* chart marker halo, matches the card */
  --brand-ink: #0e8bdf;
  --brand-soft: #e6eff8;

  /* chart chrome */
  --grid: #e6eaee;
  --axis: #cfd6dc;

  /* top panel: a blue-to-navy band carrying the title, the counts and the filters */
  --panel-grad: linear-gradient(280deg, #5b8ae0 0%, #4a6cb8 38%, #34487c 72%, #2b3961 100%);
  --panel-glow: 0 18px 40px -18px rgba(43, 57, 97, .55);
  --panel-hi: rgba(255, 255, 255, .10);
  --on-panel: #ffffff;
  --on-panel-soft: rgba(255, 255, 255, .78);
  --panel-glass: rgba(255, 255, 255, .12);
  --panel-glass-hi: rgba(255, 255, 255, .20);
  --panel-line: rgba(255, 255, 255, .24);

  /* elevation ladder: resting, floating, transient */
  --shadow: 0 1px 2px rgba(16, 32, 64, .04), 0 2px 10px rgba(14, 139, 223, .07);
  --shadow-xs: 0 1px 2px rgba(16, 32, 64, .08);
  --float: 0 14px 44px rgba(16, 32, 64, .18);
  --float-heavy: 0 14px 44px rgba(16, 32, 64, .20);
  --tipsh: 0 8px 28px rgba(16, 32, 64, .16);
  --on-fill: #ffffff;   /* text on a saturated fill: brand mark, ageing chips */
  --logo-plate: transparent;   /* behind the header logos */
  --ease: cubic-bezier(.2, 0, 0, 1);
  --r-lg: 12px;
  --r-xl: 16px;
  --r-2xl: 22px;
  --font: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: light;
}

:root[data-theme="dark"] {
  --bg: #0e1216;
  --card: #161b20;
  --ink: #f4f6f8;
  --muted: #c2ccd3;
  --faint: #99aab6;
  --line: #2d353d;
  --inset: #1b2127;
  --brand: #45a9eb;

  --good: #52c88f;   --good-bg: rgba(0, 164, 85, .16);
  --warn: #f9c566;   --warn-bg: rgba(245, 158, 0, .16);
  --inert: #99aab6;  --inert-bg: #232a31;
  --bad: #ff8e8e;    --bad-bg: rgba(255, 67, 67, .16);

  --s-app: #35a635;
  --s-draft: #8a99a5;
  --s-reop: #f3b437;
  --s-prog: #4f93e3;
  --s-rej: #ef6b6a;
  --s-idle: #3a444d;

  --cat-1: #3987e5;
  --cat-2: #d95926;
  --cat-3: #199e70;
  --cat-4: #c98500;
  --cat-5: #d55181;
  --cat-6: #008300;
  --cat-7: #9085e9;
  --cat-8: #e66767;

  /* one step lighter in dark mode */
  --age-1: #a3c8f3;
  --age-2: #86b6ef;
  --age-3: #6da7ec;
  --age-4: #3987e5;
  --age-5: #256abf;

  --line-soft: #232a31;
  --surface: #161b20;
  --brand-ink: #74bef0;
  --brand-soft: rgba(23, 147, 230, .18);

  --grid: #242c34;
  --axis: #323c45;

  --panel-grad: linear-gradient(280deg, #3f6dc6 0%, #35549c 38%, #263a69 72%, #1f2b4c 100%);
  --panel-glow: 0 18px 40px -18px rgba(0, 0, 0, .6);
  --panel-hi: rgba(255, 255, 255, .07);

  --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 2px 10px rgba(0, 0, 0, .35);
  --shadow-xs: 0 1px 2px rgba(0, 0, 0, .4);
  --float: 0 14px 44px rgba(0, 0, 0, .5);
  --float-heavy: 0 14px 44px rgba(0, 0, 0, .55);
  --tipsh: 0 8px 28px rgba(0, 0, 0, .45);
  --on-fill: #0e1216;
  --logo-plate: #ffffff;   /* the logos are drawn for a light background */
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 14px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
a { color: inherit; text-decoration: none; }
h1, h2 { margin: 0; font-weight: 600; }
.container { max-width: 1500px; margin: 0 auto; padding: 20px 20px calc(28px + env(safe-area-inset-bottom)); }
@media (max-width: 760px) { .container { padding-left: 14px; padding-right: 14px; } }
.top { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.logos { display: flex; border-radius: 10px; }
.logo { height: 28px; display: block; }
:root[data-theme="dark"] .logos { background: var(--logo-plate); padding: 4px 10px; }
.spacer { flex: 1; }
.btn { appearance: none; border: 1px solid var(--line-soft); background: var(--card); color: var(--ink); border-radius: 10px; min-height: 34px; padding: 0 12px; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; transition: border-color .12s linear, transform .1s var(--ease); }
.btn:hover { border-color: var(--brand); }
.btn:active { transform: scale(.985); }
.btn:focus-visible, a:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
.hero { margin-top: 18px; background: var(--panel-grad); box-shadow: var(--panel-glow); color: var(--on-panel); border-radius: var(--r-2xl); padding: 22px; }
.eyebrow { font-size: 10.5px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--on-panel-soft); }
.hero h1 { font-size: 24px; letter-spacing: -.02em; margin-top: 2px; }
.hero p { margin: 6px 0 0; color: var(--on-panel-soft); font-size: 13px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(268px, 1fr)); gap: 14px; margin-top: 26px; }
.card { display: block; background: var(--card); border: 1px solid var(--line-soft); border-radius: var(--r-xl); padding: 16px 18px; box-shadow: var(--shadow); transition: border-color .12s linear, transform .1s var(--ease); }
.card:hover { border-color: var(--brand); }
.card:active { transform: scale(.985); }
.card-top { display: flex; align-items: baseline; gap: 10px; }
.code { font-size: 10.5px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--brand); }
.card h2 { font-size: 15px; letter-spacing: -.01em; margin-top: 2px; }
.state { margin-left: auto; font-size: 11.5px; font-weight: 600; padding: 2px 8px; border-radius: 999px; }
.state.fresh { background: var(--good-bg); color: var(--good); }
.state.stale { background: var(--warn-bg); color: var(--warn); }
.state.unavailable { background: var(--bad-bg); color: var(--bad); }
.nums { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 14px; }
.v { font-size: 20px; font-weight: 600; letter-spacing: -.03em; line-height: 1; font-variant-numeric: tabular-nums; }
.l { margin-top: 6px; font-size: 10.5px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.track { margin-top: 14px; height: 8px; border-radius: 4px; background: var(--inset); display: flex; gap: 2px; overflow: hidden; }
.track i { display: block; height: 100%; border-radius: 4px; }
.c-complete { background: var(--s-app); } .c-started { background: var(--s-prog); } .c-notStarted { background: var(--s-idle); }
.when { margin-top: 10px; font-size: 12px; color: var(--faint); }
.sc { margin-top: 12px; font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.sc b { color: var(--ink); font-weight: 600; }
.neg { color: var(--bad); }
.empty { margin-top: 26px; color: var(--muted); }
.foot { margin-top: 30px; display: flex; gap: 18px; flex-wrap: wrap; font-size: 12px; color: var(--faint); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>

  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function n(v) { return v == null ? "—" : nf.format(v); }
  function p(v) { return v == null ? "—" : (Math.round(v * 10) / 10).toFixed(1).replace(/\.0$/, "") + "%"; }
  var MON = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
  function d(iso) { if (!iso) return "—"; var x = iso.slice(0, 10).split("-"); return +x[2] + " " + MON[+x[1] - 1] + " " + x[0] + ", " + iso.slice(11, 16) + " IST"; }
  function setTheme(t) { root.setAttribute("data-theme", t); document.getElementById("theme").textContent = t === "dark" ? "Light" : "Dark"; try { localStorage.setItem("jui-theme", t); } catch (e) { /* storage unavailable */ } }
  var t0 = "light"; try { t0 = localStorage.getItem("jui-theme") || "light"; } catch (e) { /* storage unavailable */ }
  setTheme(t0);
  document.getElementById("theme").addEventListener("click", function () { setTheme(root.getAttribute("data-theme") === "dark" ? "light" : "dark"); });
  var STATE = { fresh: "Up to date", stale: "Stale copy", unavailable: "No data" };
  var el = document.getElementById("cards");
  if (!P.projects.length) { el.outerHTML = '<p class="empty">No project has been built yet. Run a project refresh to add its card.</p>'; return; }
  function pts(v) { return v == null ? "—" : (v > 0 ? "+" : v < 0 ? "−" : "") + Math.abs(v).toFixed(1).replace(/\.0$/, "") + " pts"; }
  el.innerHTML = P.projects.map(function (s) {
    var t = s.tasks || 0;
    function seg(cls, v) { return v ? '<i class="' + cls + '" style="flex:' + v + ' 1 0" title="' + n(v) + '"></i>' : ""; }
    return '<a class="card" href="' + esc(s.href) + '"><div class="card-top"><div><div class="code">' + esc(s.key) + "</div><h2>" + esc(s.title) + '</h2></div><span class="state ' + esc(s.state) + '">' + esc(STATE[s.state] || s.state) + "</span></div>" +
      '<div class="nums"><div><div class="v">' + n(s.tasks) + '</div><div class="l">Activities</div></div><div><div class="v">' + p(s.completePct) + '</div><div class="l">Complete</div></div><div><div class="v">' + n(s.overdue) + '</div><div class="l">Overdue</div></div></div>' +
      (t ? '<div class="track" aria-label="' + n(s.complete) + " complete, " + n(s.started) + " started, " + n(s.notStarted) + ' not started">' + seg("c-complete", s.complete) + seg("c-started", s.started) + seg("c-notStarted", s.notStarted) + "</div>" : "") +
      (s.scurveActualPct != null ? '<div class="sc">S-curve: actual <b>' + p(s.scurveActualPct) + "</b> vs baseline <b>" + p(s.scurveBaselinePct) + '</b> <span class="' + (s.scurveActualPct - s.scurveBaselinePct < -0.05 ? "neg" : "") + '">(' + pts(s.scurveActualPct - s.scurveBaselinePct) + ")</span></div>" : "") +
      '<div class="when">' + n(s.subtrades) + " subtrades · " + n(s.areas) + " areas · refreshed " + d(s.dataAsOf || s.generatedAt) + "</div></a>";
  }).join("");
})();
</script>
</body>

name: "Refresh JUI - JUI"

# Generated by `python -m build new-project`. Refreshes the JUI page and data tables from
# VisiLean (3 API calls: the JUI task history and workforce, and the JUI-1A master schedule for
# the S-curve page), publishes the page to the gh-pages branch, uploads the data tables as a
# workflow artifact, then asks the portfolio workflow to rebuild the landing page.
# Tokens: repository secrets VL_TOKEN_JUI (JUI task history and workforce: one token per project,
# only type= differs) and VL_TOKEN_JUI_1A (the JUI-1A master schedule).

on:
  schedule:
    - cron: "21 4 * * *"   # 09:51 IST
    - cron: "21 10 * * *"   # 15:51 IST
  workflow_dispatch:

permissions:
  contents: write   # push to gh-pages
  actions: write    # start the portfolio workflow

concurrency:
  group: refresh-JUI
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # last good copy of the feed: an outage gives a "stale" page instead of an empty one
      - name: Restore last good data
        uses: actions/cache@v4
        with:
          path: .cache
          key: vl-feed-JUI-${{ github.run_id }}
          restore-keys: |
            vl-feed-JUI-

      - name: Self-test calculation logic
        run: python -m build selftest

      - name: Fetch the published site
        run: bash .github/scripts/pages.sh fetch

      - name: Build JUI
        id: build
        env:
          VL_TOKEN_JUI: ${{ secrets.VL_TOKEN_JUI }}
          # S-curve page: the JUI-1A master schedule
          VL_TOKEN_JUI_1A: ${{ secrets.VL_TOKEN_JUI_1A }}
        run: |
          set -uo pipefail
          python -m build build --project "JUI" --source live --no-landing | tee build.log
          code=${PIPESTATUS[0]}
          echo "code=$code" >> "$GITHUB_OUTPUT"
          [ "$code" = "0" ] || [ "$code" = "2" ] || exit "$code"

      # Tables 1-4 (Table 1 is raw and never published)
      - name: Upload data tables
        uses: actions/upload-artifact@v4
        with:
          name: JUI-tables
          path: data/JUI/
          retention-days: 14
          if-no-files-found: ignore

      - name: Validate
        run: python -m build validate --project "JUI"

      - name: Scan for credentials
        run: bash .github/scripts/pages.sh scan "JUI"

      - name: Publish JUI
        run: bash .github/scripts/pages.sh publish "Refresh JUI" "JUI"

      - name: Refresh the portfolio page
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run portfolio.yml --ref "${{ github.ref_name }}"

      - name: Report problems
        run: |
          state=$(python -c "import json; print(json.load(open('dist/JUI/build.json'))['state'])")
          echo "### JUI: $state" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.build.outputs.code }}" = "2" ]; then
            echo "::error title=VisiLean token rejected::Fix repository secret VL_TOKEN_JUI"; exit 1
          fi
          if [ "$state" = "unavailable" ]; then
            echo "::error title=No data::JUI has no data: check secret VL_TOKEN_JUI and the project GUID"; exit 1
          fi

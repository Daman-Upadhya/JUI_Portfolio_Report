name: "Refresh JUI02 - JUI02"

# Generated by `python -m build new-project`. Refreshes the JUI02 page and data tables from
# VisiLean (3 API calls: the JUI02 quantity tracker task history and workforce, and the JUI02 P6
# master schedule for the S-curve page), publishes the page to the gh-pages branch, uploads the
# four tables as a workflow artifact, then asks the portfolio workflow to rebuild the landing page.
# Tokens: repository secrets VL_TOKEN_JUI02 (JUI02 quantity tracker task history and workforce) and
# VL_TOKEN_JUI02_P6 (the JUI02 P6 master schedule).

on:
  schedule:
    - cron: "25 4 * * *"   # 09:55 IST
    - cron: "25 10 * * *"   # 15:55 IST
  workflow_dispatch:

permissions:
  contents: write   # push to gh-pages
  actions: write    # start the portfolio workflow

concurrency:
  group: refresh-JUI02
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # last good copy of the feed: an outage gives a "stale" page instead of an empty one
      - name: Restore last good data
        uses: actions/cache@v4
        with:
          path: .cache
          key: vl-feed-JUI02-${{ github.run_id }}
          restore-keys: |
            vl-feed-JUI02-

      - name: Self-test calculation logic
        run: python -m build selftest

      - name: Fetch the published site
        run: bash .github/scripts/pages.sh fetch

      - name: Build JUI02
        id: build
        env:
          VL_TOKEN_JUI02: ${{ secrets.VL_TOKEN_JUI02 }}
          # S-curve page: the JUI02 P6 master schedule
          VL_TOKEN_JUI02_P6: ${{ secrets.VL_TOKEN_JUI02_P6 }}
        run: |
          set -uo pipefail
          python -m build build --project "JUI02" --source live --no-landing | tee build.log
          code=${PIPESTATUS[0]}
          echo "code=$code" >> "$GITHUB_OUTPUT"
          [ "$code" = "0" ] || [ "$code" = "2" ] || exit "$code"

      # Tables 1-4 (Table 1 is raw and never published)
      - name: Upload data tables
        uses: actions/upload-artifact@v4
        with:
          name: JUI02-tables
          path: data/JUI02/
          retention-days: 14
          if-no-files-found: ignore

      - name: Validate
        run: python -m build validate --project "JUI02"

      - name: Scan for credentials
        run: bash .github/scripts/pages.sh scan "JUI02"

      - name: Publish JUI02
        run: bash .github/scripts/pages.sh publish "Refresh JUI02" "JUI02"

      - name: Refresh the portfolio page
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run portfolio.yml --ref "${{ github.ref_name }}"

      - name: Report problems
        run: |
          state=$(python -c "import json; print(json.load(open('dist/JUI02/build.json'))['state'])")
          echo "### JUI02: $state" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.build.outputs.code }}" = "2" ]; then
            echo "::error title=VisiLean token rejected::Fix repository secret VL_TOKEN_JUI02"; exit 1
          fi
          if [ "$state" = "unavailable" ]; then
            echo "::error title=No data::JUI02 has no data: check secret VL_TOKEN_JUI02 and the project GUID"; exit 1
          fi
